# Configuration for local development with the Supabase CLI (`npx supabase start`).
# Hosted projects are configured in the Supabase dashboard — see README.md.

project_id = "fernando-osman-portfolio"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
# Must be >= the largest bucket limit (documents: 30 MB).
file_size_limit = "30MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# No public sign-up: admin accounts are created manually.
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
